; PgBouncer for the labs. The app connects to PgBouncer on port 6441, and PgBouncer hands each
; transaction one of a few real connections to PostgreSQL.

[databases]
shop = host=postgres port=5432 dbname=shop

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres

; Transaction mode: a client gets a server connection for one transaction, then gives it back.
; A statement outside a transaction is a transaction of its own.
pool_mode = transaction

; At most 2 server connections to the shop database, however many clients connect. A small pool
; shows the bugs of lab 03 on every run.
default_pool_size = 2
max_client_conn = 100
