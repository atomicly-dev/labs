name: atomicly-labs-pooling
services:
  postgres:
    image: postgres:18.6-alpine
    # A small max_connections, so lab 02 runs out of connections with a few pools.
    command: ["postgres", "-c", "max_connections=20"]
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5441:5432"
    # The database starts from seed.sql each time the container is created, and keeps its data
    # in memory, so `docker compose down` throws it away.
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "shop"]
      interval: 1s
      timeout: 3s
      retries: 30

  # PgBouncer in transaction pooling mode, in front of the same database. See pgbouncer.ini.
  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0@sha256:488422e38cff912895d0d65d8963fcd306e6ac589a724398b6eb8e294e94d624
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:6441:6432"
    volumes:
      - ./pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432", "-U", "postgres", "-d", "shop"]
      interval: 1s
      timeout: 3s
      retries: 30
