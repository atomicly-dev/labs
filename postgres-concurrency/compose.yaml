name: atomicly-labs-postgres
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5440:5432"
    # The database starts from seed.sql each time the container is created, and keeps its data
    # in memory, so `docker compose down` throws it away.
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "shop"]
      interval: 1s
      timeout: 3s
      retries: 30
