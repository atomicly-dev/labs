name: atomicly-labs-production
services:
  postgres:
    image: postgres:18.6-alpine
    # pg_stat_statements has to load when the server starts, so lab 01 can read query statistics.
    # The data lives in memory, so a small max_wal_size keeps the write-ahead log from growing to
    # its default of 1 GB over many test runs.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_wal_size=64MB
      - -c
      - min_wal_size=32MB
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5442:5432"
    # The database starts from seed.sql each time the container is created, and keeps its data
    # in memory, so `docker compose down` throws it away.
    tmpfs:
      - /var/lib/postgresql
    # Parallel queries use shared memory, and the default 64 MB can run out.
    shm_size: 256mb
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    # The seed takes a few seconds. While it runs, the server listens only on its Unix socket, so
    # checking over TCP waits until the seed is done.
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "shop"]
      interval: 1s
      timeout: 3s
      retries: 60
